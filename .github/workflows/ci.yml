name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install ansible-core yamllint
          ansible-galaxy collection install community.general
          wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y vagrant shellcheck

      - name: yamllint
        run: yamllint --strict .

      - name: Ansible syntax
        run: |
          ansible-playbook --syntax-check -i localhost, ansible/ubuntu.yml
          ansible-playbook --syntax-check -i localhost, ansible/kali.yml

      - name: Vagrantfile
        run: |
          VM_TYPE=ubuntu vagrant validate --ignore-provider
          VM_TYPE=kali vagrant validate --ignore-provider

      - name: shellcheck
        run: shellcheck scripts/*.sh
